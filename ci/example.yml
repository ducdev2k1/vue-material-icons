# ============================================
# CI/CD Template cho Example Folder
# Include vào .gitlab-ci.yml chính
# ============================================

# Job: Install dependencies cho example
.example:install:
  stage: install
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm install -g pnpm
    - pnpm config set store-dir $PNPM_STORE
  script:
    - cd example
    - pnpm install --frozen-lockfile
  cache:
    key: example-${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store
      - example/node_modules/
    policy: push

# Job: Build example (Client + Server SSR)
.example:build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm install -g pnpm
    - pnpm config set store-dir $PNPM_STORE
  script:
    - cd example
    - pnpm run build
  artifacts:
    name: "example-build-${CI_COMMIT_SHORT_SHA}"
    paths:
      - example/dist/
    expire_in: 1 week
  cache:
    key: example-${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store
      - example/node_modules/
    policy: pull

# Job: Deploy Staging
.example:deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - echo "🚀 Deploying Example to Staging..."
    - rsync -avz --delete example/dist/ $STAGING_USER@$STAGING_HOST:$STAGING_PATH
    - echo "✅ Deploy staging thành công!"
  environment:
    name: staging
    url: $STAGING_URL

# Job: Deploy Production
.example:deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - echo "🚀 Deploying Example to Production..."
    - rsync -avz --delete example/dist/ $PROD_USER@$PROD_HOST:$PROD_PATH
    - echo "✅ Deploy production thành công!"
  environment:
    name: production
    url: $PROD_URL
